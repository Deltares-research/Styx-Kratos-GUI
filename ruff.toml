# Lint settings for `ruff check` (the lint workflow, .github/workflows/lint.yml).
# Pyflakes plus the pycodestyle errors: real mistakes, not style. The code is not
# run through a formatter, so formatting rules stay off.
target-version = "py310"
extend-exclude = [
    "frontend/vendor",
]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # imports placed after a sys.path set-up or a constant they need, on purpose
    "E731",  # a short lambda bound to a name reads better in tests than a nested def
    "E741",  # `l` for a layer is this codebase's convention
]
