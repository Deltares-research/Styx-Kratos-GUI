# Type checking for `mypy` (the lint workflow, .github/workflows/lint.yml). It reports
# without failing the build until the existing findings are worked down; then drop
# `continue-on-error` from the mypy job there.
[mypy]
files = core, backend
python_version = 3.10
# gmsh and a few others ship no type information.
ignore_missing_imports = True
warn_unused_ignores = True
