<script>
T.run().then(function (results) {
  // Also exposed as data so a driver can assert on the outcome without reading a screen.
  window.__TEST_RESULTS__ = results;

  var summary = document.getElementById('summary');
  summary.className = results.ok ? 'ok' : 'bad';
  summary.textContent = results.passed + ' passed, ' + results.failed + ' failed'
                      + ' (' + results.total + ' total)';

  document.getElementById('list').innerHTML = results.names.map(function (n) {
    var pass = n.indexOf('PASS ') === 0;
    return '<li class="' + (pass ? 'pass' : 'fail') + '">' + n.slice(5) + '</li>';
  }).join('');

  document.getElementById('detail').innerHTML = results.failures.map(function (f) {
    return '<pre>' + f.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
  }).join('');
  document.title = (results.ok ? 'PASS' : 'FAIL') + ' — ' + summary.textContent;
});
</script>
