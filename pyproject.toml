# Build system and project metadata
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DeltaresStyx"
version = "0.1.0"
description = "A GUI for the Kratos structural analysis framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.14.3",
    "gmsh==4.13.1",
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.3.5; python_version >= '3.11' and python_version < '3.15'",
    "numpy==2.5.4; python_version >= '3.15'",
    "python-multipart==0.0.32; python_version < '3.11'",
    "python-multipart==0.0.33; python_version >= '3.11'",
]

[project.scripts]
kratos-gui = "backend.launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*", "core*", "cli*"]

[tool.setuptools.package-data]
backend = ["../frontend/**/*"]

# Settings for the Python tools: pytest, coverage, mypy and ruff.

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: needs Playwright and a Chromium; skipped when Playwright is missing",
    "e2e: drives the real GUI against a live server (--run-e2e)",
    "kratos: needs a working Kratos install (--run-kratos)",
    "benchmark: a Kratos benchmark case, minutes each (--run-benchmarks)",
    "perf: timing against tests/perf/baseline.json (--run-perf)",
    "slow: more than ten seconds without Kratos (--run-slow)",
    "covers(*ids): GUI inventory entries this test exercises",
]
filterwarnings = [
    "error::DeprecationWarning",
    # starlette's own module-level type alias touches a deprecated anyio name at import
    # time. Ours to neither fix nor be failed by; the blanket rule above still applies to
    # everything in core/ and backend/.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # uvicorn 0.34 calls asyncio.iscoroutinefunction when it starts, which Python 3.14
    # deprecates. Only the e2e server start meets it.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:uvicorn.config",
    # fastapi.testclient imports starlette's TestClient, which now asks for httpx2. The
    # tests keep the pinned httpx (requirements.txt) until fastapi moves over.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # pytest-playwright 0.10.0 defines its fallback base_url fixture (used when
    # pytest-base-url is not installed) as an instance method, which pytest 9.2
    # deprecates. Only the browser and e2e tiers request it.
    "ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning",
]

# ── coverage, for `pytest --cov` (plan/alpha-test-plan.md Task 0.5) ─────────
[tool.coverage.run]
source = ["core", "backend", "cli"]
# Run by the launcher's own bootstrap; covered by the smoke tier.
omit = ["backend/launcher.py"]
# gmsh runs in a worker process (core/gmsh_worker.py); without this its modules look untested.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

# ── mypy (the lint workflow, .github/workflows/lint.yml) ─────────────────────
# No findings since 2026-10-12, and the job fails on a new one.
[tool.mypy]
files = ["core", "backend", "cli"]
python_version = "3.10"
# The lint workflow runs on Linux; checked as Linux on Windows too, so `readline` has
# its functions there and both agree.
platform = "linux"
# gmsh and a few others ship no type information.
ignore_missing_imports = true
warn_unused_ignores = true

# ── ruff check (the lint workflow, .github/workflows/lint.yml) ───────────────
# Pyflakes plus the pycodestyle errors: real mistakes, not style. The code is not run
# through a formatter, so formatting rules stay off.
[tool.ruff]
target-version = "py310"
extend-exclude = [
    "frontend/vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # imports placed after a sys.path set-up or a constant they need, on purpose
    "E731",  # a short lambda bound to a name reads better in tests than a nested def
    "E741",  # `l` for a layer is this codebase's convention
]
