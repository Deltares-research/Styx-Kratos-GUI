# Link checking for the Markdown documents (the docs workflow, .github/workflows/docs.yml).
# Links to files in the repository are checked too, so a renamed file shows up here.

exclude = [
    # The app's own address, only there while it runs.
    '^https?://(localhost|127\.0\.0\.1)',
    # Where the README says the project lives. It answers 404 until the public copy is
    # made: remove this line then.
    '^https://github\.com/Deltares-research/Styx-Kratos-GUI',
    # The screenshots of the GUI tutorials: made in CI and never committed. The site build
    # (.github/workflows/docs-site.yml) checks them.
    '/docs/gui_tutorials/images/',
]

exclude_path = ["frontend/vendor"]

# The #section part of a link is not checked: GitHub's generated heading ids are not
# in the Markdown source.
include_fragments = "none"

max_retries = 3
retry_wait_time = 5
timeout = 30
# 429: rate-limited, which says nothing about the link itself.
accept = ["200..=299", "429"]
