# The GUI tutorials site (docs/gui_tutorials/, mkdocs.yml): the screenshots made from the
# GUI of this commit, then the site, on every pull request and every push to main. A
# reviewer downloads the site from the run's artifacts. A push to main also publishes it
# on GitHub Pages.
#
# Calculate replays the recorded Kratos run of each tutorial (tests/fakes/replay_kratos.py),
# as the runners have no Kratos. A deck that no longer matches its recorded run is a
# warning on a pull request and a failure on main, so the site never shows the results of
# another model. To fix it, run `python tools/gui_tutorial.py NAME --record` on a computer
# with Kratos and commit the new run.
name: docs site

# Pushes count only on main: a pull request's own branch is covered by pull_request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: docs site
    # Windows, as the recorded runs are: the deck compare then meets the same gmsh build,
    # and the screenshots the fonts of a local preview on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KRATOS_GUI_TEST_BROWSER_CHANNEL: bundled
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-docs.txt

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-docs.txt

      - name: Playwright's Chromium
        run: python -m playwright install chromium

      - name: Screenshots and site
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then strict="--strict-deck"; else strict=""; fi
          python tools/gui_tutorial.py $strict

      - name: Keep the site
        uses: actions/upload-artifact@v7
        with:
          name: gui-tutorials-site
          path: build/gui_tutorials/site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: publish
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publish at a time, and a publish in progress is never cut off.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gui-tutorials-site
          path: site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
