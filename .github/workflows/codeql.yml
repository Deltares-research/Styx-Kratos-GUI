# GitHub's security scan of the Python backend and the browser frontend. Findings
# appear under the repository's Security tab.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, for advisories published since the last push

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code scanning is free on a public repository and needs GitHub Code Security on a
  # private one; without it every upload fails. A private repository that has it sets
  # the repository variable CODE_SECURITY to true. The schedule's event carries no
  # repository, so the API is asked rather than the event.
  available:
    name: code scanning available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CODE_SECURITY: ${{ vars.CODE_SECURITY }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" = "false" ] || [ "$CODE_SECURITY" = "true" ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private repository without CODE_SECURITY=true: CodeQL skipped."
          fi

  analyze:
    name: ${{ matrix.language }}
    needs: available
    if: needs.available.outputs.scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      # Neither language is compiled here, so nothing is built.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
