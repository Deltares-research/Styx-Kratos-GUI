# A pull request that adds or bumps a dependency with a known vulnerability fails here,
# before it is merged. Dependabot (dependabot.yml) handles the ones already in.
name: dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: dependency review
    # Free on a public repository; a private one needs GitHub Code Security, and says so
    # with the repository variable CODE_SECURITY=true. Until then pip-audit
    # (security.yml) covers the same ground.
    if: ${{ !github.event.repository.private || vars.CODE_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
