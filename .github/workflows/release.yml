# Pushing a version tag makes a GitHub release:
#
#   git tag -a v1.2.0 -m "Styx 1.2.0"
#   git push origin v1.2.0
#
# The release carries the source as .zip and .tar.gz, built from the tag with
# `git archive` (what it leaves out is listed in .gitattributes), and notes made from
# the merged pull requests, sorted by label (.github/release.yml). A tag with a hyphen,
# such as v1.2.0-rc.1, makes a pre-release.
#
# A release made by hand on the Releases page pushes its tag too. The release is then
# already there, so the workflow attaches the archives to it and changes nothing else.
#
# The tag has to be `v` + VERSION in core/version.py, and the unpacked archive has to
# say that version (`kratos-cli --version`, the GUI's About box), or nothing is published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check the archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # With the tags and their history: `git archive` writes `git describe` into the
      # download (export-subst in .gitattributes), and describe needs the tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag is the version in core/version.py
        run: |
          version=$(python3 -c "from core.version import VERSION; print(VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but core/version.py says $version: set VERSION to ${GITHUB_REF_NAME#v} first"
            exit 1
          fi

      - name: Source archives
        run: |
          name="styx-${GITHUB_REF_NAME}"
          mkdir dist
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" "$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: System libraries the gmsh wheel loads
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrender1

      # What a user does with the download: unpack it and start it.
      - name: The unpacked archive starts
        run: |
          cd "$RUNNER_TEMP"
          unzip -q "$GITHUB_WORKSPACE/dist/styx-${GITHUB_REF_NAME}.zip"
          "./styx-${GITHUB_REF_NAME}/run.sh" --check

      - name: The unpacked archive says its version
        run: |
          cd "$RUNNER_TEMP/styx-${GITHUB_REF_NAME}"
          said=$(python3 -c "from core.version import describe; print(describe())")
          if [ "$said" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::the archive says it is $said, not ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on the Releases page also pushes its tag, so the release is
          # already there: attach the archives to it and keep its notes and pre-release mark.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Styx ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag --prerelease="$prerelease"
