# Two scans that need nothing from GitHub's paid security features:
#   pip-audit  known vulnerabilities in the pinned packages: the app's, the test tools' and
#              the tutorial site's
#   gitleaks   secrets (tokens, keys, passwords) anywhere in the git history
# The weekly run catches advisories published after the last push.
name: security

# Pushes count only on main: a pull request's own branch is covered by pull_request.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # pip-audit resolves the files in a throwaway environment and asks the PyPI
      # advisory database about every package, the dependencies' dependencies included.
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --progress-spinner off -r requirements.txt -r requirements-dev.txt \n            -r requirements-docs.txt

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From the release's gitleaks_<version>_checksums.txt; update with the version.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary itself, not gitleaks-action, which needs a paid licence for a
      # repository owned by an organisation. Known false positives are listed by
      # fingerprint in .gitleaksignore.
      - name: gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose --no-banner .
