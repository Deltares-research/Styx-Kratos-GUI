# What every push and pull request must pass (plan/active/alpha-test-plan.md Task 0.6, decision D8).
# Kratos is not installable here, so the kratos/bench tiers run on a machine that has it.
name: tests

# Pushes count only on main: a pull request's own branch is covered by pull_request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push supersedes a pull request's run; every run on main is kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.11: quickjs ships wheels for it, so the headless JS suites run.
        python: ["3.11"]
        include:
          # The developers' venv; quickjs has no wheel here, so the runner reports headless as skipped.
          - os: windows-latest
            python: "3.13"
    env:
      KRATOS_GUI_TEST_BROWSER_CHANNEL: bundled
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System libraries the gmsh wheel loads (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrender1

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install quickjs || echo "quickjs did not install; headless JS will be reported as skipped"

      - name: Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      # The floor sits a little under the measured line coverage (97 % on 2026-10-11), so
      # a change that lands untested code fails here instead of eroding it quietly.
      - name: Tests (syntax, headless JS, pytest, browser suite, GUI end-to-end)
        run: >
          python tools/test.py e2e
          --cov=core --cov=backend --cov-report=term --cov-report=html --cov-fail-under=95
          --js-coverage --tracing retain-on-failure --output test-results

      - name: Coverage on the run's summary page
        if: always()
        shell: bash
        run: |
          if [ -f .coverage ]; then
            echo "### Python coverage, ${{ matrix.os }} / Python ${{ matrix.python }}" >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep traces and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results/
            htmlcov/
            htmlcov-js/
          if-no-files-found: ignore
          retention-days: 14
