# What every push and pull request must pass (plan/alpha-test-plan.md Task 0.6, decision D8).
# Kratos is not installable here, so the kratos/bench tiers run on a machine that has it.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.11: quickjs ships wheels for it, so the headless JS suites run.
        python: ["3.11"]
        include:
          # The developers' venv; quickjs has no wheel here, so the runner reports headless as skipped.
          - os: windows-latest
            python: "3.13"
    env:
      KRATOS_GUI_TEST_BROWSER_CHANNEL: bundled
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: System libraries the gmsh wheel loads (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrender1

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt -r server/requirements-dev.txt
          python -m pip install quickjs || echo "quickjs did not install; headless JS will be reported as skipped"

      - name: Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: Tests (syntax, headless JS, pytest, browser suite, GUI end-to-end)
        run: >
          python tools/test.py e2e
          --cov=app --cov-report=term --cov-report=html --js-coverage
          --tracing retain-on-failure --output test-results

      - name: Keep traces and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            server/test-results/
            server/htmlcov/
            server/htmlcov-js/
          if-no-files-found: ignore
          retention-days: 14
